# Author-written draft, not app content. See counter-pilot.md for sources and limits.
schema: counter-pilot-v1
status: draft
numerals: kanji-preferred
# {} hides only the counter. phrase identifies the whole replaceable counting expression.
# Written variants retain their tier after Arabic/kanji numeral normalization.
# A generic variant can require replacing the phrase, not just inserting a counter.
counters:
  - id: hon
    counter: 本
    reading: ほん
    sources: [hon, tsu, ko]
  - id: hiki
    counter: 匹
    reading: ひき
    sources: [hiki]
  - id: mai
    counter: 枚
    reading: まい
    sources: [mai, tsu, ko]
  - id: nin
    counter: 人
    reading: にん
    sources: [readings]
  - id: ko
    counter: 個
    reading: こ
    sources: [ko, tsu]
cards:
  - id: hon-pen-1
    counter: 本
    kind: floated-quantity
    level: 5
    text: "机の上にペンが三{}あります。"
    en: "There are three pens on the desk."
    phrase: 三本
    reading: さんぼん
    noun: pen
    good: [本, 三本]
    hard:
      - {forms: [つ, 三つ, みっつ], phrase: 三つ, reading: みっつ, reason: "A usable general count; 本 practices the usual counter for pens."}
      - {forms: [個, 三個, さんこ], phrase: 三個, reading: さんこ, reason: "A general object count; 本 is the target for long, thin pens."}
    kana: [さんぼん]
  - id: hon-umbrella-1
    counter: 本
    kind: plain
    level: 5
    text: "雨なので、傘を二{}持っていきます。"
    en: "It is raining, so I will take two umbrellas."
    phrase: 二本
    reading: にほん
    noun: umbrella
    good: [本, 二本]
    hard:
      - {forms: [つ, 二つ, ふたつ], phrase: 二つ, reading: ふたつ, reason: "A usable general count; 本 is the usual specific counter for umbrellas."}
    kana: [にほん]
  - id: hon-film-1
    counter: 本
    kind: plain
    level: 5
    text: "昨日、映画を二{}見ました。"
    en: "I watched two films yesterday."
