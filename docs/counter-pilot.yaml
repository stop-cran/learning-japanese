    reading: にほん
    noun: film
    good: [本, 二本]
    hard: []
    kana: [にほん]
    note: "本 also counts films, not just physical long objects."
    review: "Do not infer that every unlisted general counter is impossible; alternative grading needs usage evidence."
  - id: hon-question-1
    counter: 本
    kind: question
    level: 5
    text: "冷蔵庫にビールのびんは何{}ありますか。"
    en: "How many bottles of beer are in the fridge?"
    phrase: 何本
    reading: なんぼん
    noun: beer-bottle
    good: [本, 何本]
    hard:
      - {forms: [いくつ], phrase: いくつ, reading: いくつ, reason: "A general how-many question; 何本 asks specifically about bottles."}
    kana: [なんぼん, なんほん, なんぽん]
    note: "An いくつ answer replaces 何本. Never construct 何つ."
  - id: hon-approx-1
    counter: 本
    kind: approximate-range
    level: 5
    text: "公園に木が五、六{}あります。"
    en: "There are five or six trees in the park."
    phrase: "五、六本"
    reading: ごろっぽん
    noun: standing-tree
    good: [本, "五、六本", 五六本]
    hard: []
    kana: [ごろっぽん]
    review: "The range reading and acceptability of alternative counters need further dictionary/editor confirmation."
